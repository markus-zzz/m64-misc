# Application Kconfig options
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Console + logs go over the USB CDC-ACM port (see zephyr,console in the DTS).
CONFIG_LOG=y
# Logs are emitted through the shell's log backend (see below), so the
# standalone UART backend is disabled and deferred mode is used (the shell
# processes log records from its own thread).
CONFIG_LOG_BACKEND_UART=n

# Interactive shell on the USB CDC-ACM port (shares zephyr,shell-uart).
CONFIG_SHELL=y
# Route log output through the shell backend so shell prompts and log
# records don't interleave on the shared console.
CONFIG_SHELL_LOG_BACKEND=y
# Immediate (synchronous) logging: render each LOG_* at the call site instead
# of queuing it for the shell thread to drain when idle. Without this, logs
# emitted inside a long-running/blocking shell command handler are not printed
# until the handler returns (and never, if it blocks). Useful for bring-up.
CONFIG_LOG_MODE_IMMEDIATE=y

# USB device stack + CDC-ACM, used as the primary console.
# Initialize the USB device stack automatically at boot so the console is
# up before main() (and the logging backend) writes to it.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="ModRetro M64"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# System info for the console banner.
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_PRINTK=y

# SD card on SDMMC1: disk access + SD/SDHC stack.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STACK=y
CONFIG_SDHC=y

# Enable SDMMC hardware flow control: the peripheral stalls the SD clock when
# the FIFO is full/empty, preventing RX overrun / TX underrun on this marginal
# card layout (observed SDMMC_ERROR_RX_OVERRUN without it).
CONFIG_SDMMC_STM32_HWFC=y

# FAT filesystem (removable, PC-readable).
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# USB Mass Storage: export the SD card's raw blocks to the host.
# The MSC LUN maps directly to the SDMMC "SD" disk (disk_access_*), so the
# host sees the real card. FatFs and the host cannot own the FAT at the same
# time, so 'm64 sd usb on' unmounts FatFs before handing the card over.
CONFIG_USB_MASS_STORAGE=y
CONFIG_MASS_STORAGE_DISK_NAME="SD"

# CRC library, for verifying SD reads of the bitstream (m64 fpgacrc).
CONFIG_CRC=y
