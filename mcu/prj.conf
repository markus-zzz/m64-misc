# Application Kconfig options
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Primary console + logs stay on USART2 (reliable, clock-independent of USB).
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y

# USB device stack + CDC-ACM (secondary console over USB3300 ULPI HS PHY).
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="ModRetro M64"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
